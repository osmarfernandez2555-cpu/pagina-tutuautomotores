<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galpón Tutu</title>
<meta name="description" content="Recorré el galpón de Tutu Automotores en 3D: caminá entre los autos, mirá cada uno en 360° y sentate adentro.">
<meta name="theme-color" content="#0d1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#F2F4F7; --ink-2:#B9C1CE; --ink-3:#8C96A6;
  --bg:#0D1117; --panel:#121821; --panel-2:#18202B; --line:#263142; --line-2:#344257;
  --blue:#2A63D4; --blue-hi:#4C82EC; --blue-ink:#FFFFFF; --wa:#1FA855;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --ease:cubic-bezier(.16,1,.3,1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
::selection{background:var(--blue);color:#fff}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.grabbing{cursor:grabbing} #c.pointing{cursor:pointer}

/* barra superior */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-left)) 14px max(16px,env(safe-area-inset-left));pointer-events:none;background:linear-gradient(#0d1117cc,#0d111700)}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{height:30px;width:auto;display:block}
.brand .wm{font-weight:800;font-stretch:118%;letter-spacing:.01em;font-size:1.05rem;display:none}
.brand.noimg img{display:none} .brand.noimg .wm{display:block}
.brand small{display:block;font-size:.72rem;font-weight:600;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;border-left:1px solid var(--line-2);padding-left:10px}
.spacer{flex:1}
.btn{color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.btn:hover{background:var(--panel-2);border-color:#46566f}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn-primary:hover{background:var(--blue-hi);border-color:var(--blue-hi)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-wa:hover{background:#26bd61;border-color:#26bd61}
.btn[aria-pressed="true"]{background:#1d2a3e;border-color:var(--blue-hi);color:#fff}
.icon-btn{width:44px;padding:0}

/* catálogo */
.catalog{position:fixed;z-index:15;top:72px;left:16px;bottom:16px;width:340px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px -12px #000a;transition:transform .45s var(--ease),opacity .3s;overflow:hidden}
.catalog.closed{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
.cat-head{padding:16px 16px 10px}
.cat-head h2{margin:0;font-size:1.25rem;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
.cat-head p{margin:2px 0 12px;color:var(--ink-3);font-size:.85rem}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);padding:0 12px 0 38px;font-size:.95rem;caret-color:var(--blue-hi)}
.search input::placeholder{color:#7d8798}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:.84rem;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:#4a5a73}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#0d1117}
.sortrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px 10px;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--ink-3)}
.sortrow select{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;height:36px;padding:0 8px;color:var(--ink);font-size:.84rem}
.list{flex:1;overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.item{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;width:100%;text-align:left;padding:8px;border:0;border-radius:12px;background:transparent;cursor:pointer}
.item:hover,.item.on{background:var(--panel-2)}
.item img{width:72px;height:54px;object-fit:cover;border-radius:8px;background:#1b2330;display:block}
.item b{display:block;font-size:.84rem;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item span{display:block;font-size:.78rem;color:var(--ink-3);margin-top:2px}
.item em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--ink);margin-top:3px;display:block}
.badge0{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--blue);color:#fff;margin-left:6px;vertical-align:1px}
.empty{padding:28px 16px;color:var(--ink-2);font-size:.9rem;text-align:center}

/* etiquetas sobre los autos */
#tags{position:fixed;inset:0;pointer-events:none;z-index:5}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 11px 8px;border-radius:12px;border:1px solid #ffffff1f;background:#0d1117e6;box-shadow:0 8px 22px -8px #000c;cursor:pointer;white-space:nowrap;transition:opacity .25s;max-width:240px}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1px solid #ffffff1f;border-bottom:1px solid #ffffff1f;transform:translateX(-50%) rotate(45deg)}
.tag b{font-size:.92rem;font-weight:800;font-variant-numeric:tabular-nums}
.tag span{font-size:.72rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;max-width:220px}
.tag.hot{border-color:var(--blue-hi)}
.tag[hidden]{display:none}

/* ayuda y joystick */
.hint{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);z-index:12;display:flex;gap:16px;align-items:center;padding:10px 16px;border-radius:999px;background:#0d1117d9;border:1px solid var(--line);font-size:.82rem;color:var(--ink-2);white-space:nowrap;transition:opacity .4s}
.hint kbd{font:700 .74rem var(--font);padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--ink);background:var(--panel-2)}
.hint.gone{opacity:0;pointer-events:none}
.joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + var(--safe-b));z-index:12;width:118px;height:118px;border-radius:50%;border:1px solid #ffffff2e;background:#0d111799;display:none;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#f2f4f7;box-shadow:0 6px 16px #0008}
.joy-label{position:absolute;inset:auto 0 -22px;text-align:center;font-size:.7rem;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}

/* detalle */
.detail{position:fixed;z-index:25;top:16px;right:16px;bottom:16px;width:400px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px -16px #000c;transition:transform .5s var(--ease),opacity .3s;overflow:hidden}
.detail[hidden]{display:flex;transform:translateX(calc(100% + 32px));opacity:0;pointer-events:none}
.d-scroll{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.d-photo{position:relative;aspect-ratio:4/3;background:#1b2330}
.d-photo img{width:100%;height:100%;object-fit:cover;display:block;color:transparent}
.d-photo .count{position:absolute;right:10px;bottom:10px;font-size:.74rem;font-weight:700;padding:4px 8px;border-radius:8px;background:#0d1117cc;font-variant-numeric:tabular-nums}
.d-photo .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:#0d1117b3;color:#fff;display:grid;place-items:center;cursor:pointer}
.d-photo .nav:hover{background:#0d1117}
.d-photo .prev{left:10px} .d-photo .next{right:10px}
.d-photo .nav svg{width:18px;height:18px}
.d-close{position:absolute;top:10px;right:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:#0d1117cc;color:#fff;display:grid;place-items:center;cursor:pointer}
.d-close svg{width:18px;height:18px}
.thumbs{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:none;width:58px;height:44px;padding:0;border-radius:8px;border:2px solid transparent;overflow:hidden;background:#1b2330;cursor:pointer;opacity:.7}
.thumbs button[aria-current="true"]{border-color:var(--blue-hi);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.d-body{padding:16px 18px 6px}
.d-zone{font-size:.78rem;font-weight:700;color:var(--blue-hi)}
.d-body h2{margin:4px 0 6px;font-size:1.35rem;line-height:1.15;font-weight:800;font-stretch:108%;letter-spacing:-.01em;text-wrap:balance}
.d-price{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.d-price small{font-size:.8rem;font-weight:600;color:var(--ink-3);margin-left:6px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:14px 0 4px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.specs div{background:var(--panel);padding:9px 12px}
.specs dt{font-size:.72rem;color:var(--ink-3);font-weight:600}
.specs dd{margin:1px 0 0;font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.d-views{display:flex;gap:8px;padding:14px 0 0}
.d-views .btn{padding:0 12px}
.d-views .btn{flex:1;min-width:0}
.d-views .icon-btn{flex:none;width:44px}
.note{padding:10px 18px 14px;font-size:.76rem;color:var(--ink-3)}
.d-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 18px calc(14px + var(--safe-b));border-top:1px solid var(--line);background:var(--panel)}
.d-foot .full{grid-column:1/-1}
.d-step{display:flex;gap:8px}
.d-step .btn{flex:1}

/* indicador de modo */
.mode{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:12;padding:8px 14px;border-radius:999px;background:#0d1117d9;border:1px solid var(--line);font-size:.8rem;color:var(--ink-2);display:none}
.mode b{color:var(--ink)}

/* carga */
.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .6s,visibility .6s}
.loader.done{opacity:0;visibility:hidden}
.loader div{text-align:center}
.loader strong{display:block;font-size:clamp(1.8rem,5vw,3rem);font-weight:800;font-stretch:122%;letter-spacing:-.02em}
.loader span{display:block;margin-top:6px;color:var(--ink-3);font-size:.9rem}
.bar{width:220px;height:3px;margin:18px auto 0;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue-hi);transition:width .3s}
.err{max-width:420px;padding:0 24px;color:var(--ink-2)}

@media (max-width:860px){
  .catalog{top:auto;left:0;right:0;bottom:0;width:auto;height:min(68vh,560px);border-radius:20px 20px 0 0;padding-bottom:var(--safe-b)}
  .catalog.closed{transform:translateY(calc(100% + 24px))}
  .detail{top:auto;left:0;right:0;bottom:0;width:auto;height:min(78vh,700px);border-radius:20px 20px 0 0}
  .detail[hidden]{transform:translateY(calc(100% + 24px))}
  .hint{display:none}
  .joy{display:block}
  .brand small{display:none}
  .mode{top:68px}
}
@media (hover:none) and (pointer:coarse){ .joy{display:block} .hint{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important} }
</style>
</head>
<body>
<canvas id="c" aria-label="Galpón 3D de Tutu Automotores con los autos en stock. Usá el catálogo para elegir un auto."></canvas>

<header class="top">
  <a class="brand" href="https://tutuautomotores.com" target="_blank" rel="noopener" id="brand">
    <img src="https://tutuautomotores.com/wp-content/uploads/2025/08/logo.svg" alt="Tutu Automotores" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg')">
    <span class="wm">TUTU AUTOMOTORES</span>
    <small>Galpón 3D</small>
  </a>
  <div class="spacer"></div>
  <button class="btn" id="btn-cat" aria-expanded="true" aria-controls="catalog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Catálogo</span>
  </button>
</header>

<aside class="catalog" id="catalog" aria-label="Catálogo de vehículos">
  <div class="cat-head">
    <h2>Autos en el galpón</h2>
    <p id="cat-count"></p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="q">Buscar por marca o modelo</label>
      <input id="q" type="search" placeholder="Buscá marca o modelo" autocomplete="off">
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo"></div>
  <div class="sortrow">
    <span id="shown"></span>
    <label><span class="sr">Ordenar</span>
      <select id="sort">
        <option value="zona">Como están en el galpón</option>
        <option value="precio">Menor precio</option>
        <option value="precio-desc">Mayor precio</option>
        <option value="anio">Más nuevos</option>
        <option value="km">Menos kilómetros</option>
      </select>
    </label>
  </div>
  <div class="list" id="list"></div>
</aside>

<div id="tags" aria-hidden="true"></div>
<div class="mode" id="mode" role="status" aria-live="polite"></div>

<div class="hint" id="hint">
  <span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> caminar</span>
  <span>Arrastrá para mirar</span>
  <span>Tocá un auto para verlo</span>
</div>
<div class="joy" id="joy" aria-hidden="true"><i></i><span class="joy-label">Caminar</span></div>

<section class="detail" id="detail" hidden aria-labelledby="d-name">
  <div class="d-scroll">
    <div class="d-photo">
      <img id="d-img" alt="" referrerpolicy="no-referrer">
      <button class="d-close" id="d-close" aria-label="Volver al galpón"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="nav prev" id="p-prev" aria-label="Foto anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="nav next" id="p-next" aria-label="Foto siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <span class="count" id="p-count"></span>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <div class="d-body">
      <div class="d-zone" id="d-zone"></div>
      <h2 id="d-name"></h2>
      <div class="d-price" id="d-price"></div>
      <div class="d-views">
      <button class="btn" id="v-ext" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Vista 360°
      </button>
      <button class="btn" id="v-int" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 14.5V21M9.6 11.2 3.4 9.5M14.4 11.2l6.2-1.7"/></svg>Interior
      </button>
      <button class="btn icon-btn" id="v-spin" aria-pressed="true" aria-label="Girar solo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
      <dl class="specs" id="d-specs"></dl>
    </div>
    <p class="note" id="d-note">El modelo 3D es una representación del tipo de vehículo con su color. Las fotos son las reales del auto.</p>
  </div>
  <div class="d-foot">
    <a class="btn btn-wa full" id="d-wa" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
      Consultar por WhatsApp
    </a>
    <a class="btn" id="d-link" target="_blank" rel="noopener">Ver publicación</a>
    <div class="d-step">
      <button class="btn icon-btn" id="d-prev" aria-label="Auto anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="btn icon-btn" id="d-next" aria-label="Auto siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>

$('btn-cat').onclick = () => { const c = $('catalog'); const open = c.classList.contains('closed'); c.classList.toggle('closed', !open); $('btn-cat').setAttribute('aria-expanded', open); if (open && innerWidth <= 860 && sel) backToWalk(); };
if (innerWidth <= 860) closeCatalog();
renderList();

/* ---------------- etiquetas flotantes ---------------- */
const TAGN = 9; const tagEls = [];
for (let k = 0; k < TAGN; k++) { const b = document.createElement('button'); b.className = 'tag'; b.hidden = true; b.tabIndex = -1; b.innerHTML = '<b></b><span></span>'; $('tags').appendChild(b); tagEls.push(b); b.addEventListener('click', () => { if (b._car) selectCar(b._car); }); }
const vtmp = new THREE.Vector3(), fwd = new THREE.Vector3();
function updateTags() {
  if (mode !== 'walk') { tagEls.forEach(t => t.hidden = true); return; }
  camera.getWorldDirection(fwd);
  const cand = [];
  for (const c of cars) { if (!matches(c)) continue; vtmp.set(c.x - camera.position.x, 0, c.z - camera.position.z); const d = vtmp.length(); if (d > 15 || d < 1.5) continue; vtmp.normalize(); if (vtmp.x * fwd.x + vtmp.z * fwd.z < .45) continue; cand.push([d, c]); }
  cand.sort((a, b) => a[0] - b[0]);
  const placed = [];
  for (let k = 0; k < TAGN; k++) {
    const el = tagEls[k]; const item = cand[k]; if (!item) { el.hidden = true; el._car = null; continue; }
    const c = item[1]; vtmp.set(c.x, c.H + .45, c.z).project(camera);
    if (vtmp.z > 1) { el.hidden = true; continue; }
    const sx = (vtmp.x * .5 + .5) * innerWidth, sy = (-vtmp.y * .5 + .5) * innerHeight;
    if (placed.some(([px, py]) => Math.abs(px - sx) < 170 && Math.abs(py - sy) < 52)) { el.hidden = true; continue; }
    placed.push([sx, sy]);
    if (el._car !== c) { el._car = c; el.querySelector('b').textContent = fmtPrice(c); el.querySelector('span').textContent = c.name; }
    el.hidden = false; el.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-100%)`; el.style.opacity = String(Math.min(1, (15 - item[0]) / 4));
    el.classList.toggle('hot', hover === c);
  }
}

/* ---------------- entrada: mouse, teclado, toque ---------------- */
const keys = new Set();
addEventListener('keydown', e => {
  if (e.target.closest('input,select,textarea')) return;
  if (e.key === 'Escape') { if (mode === 'interior') selectCar(sel); else if (mode === 'detail') backToWalk(); return; }
  keys.add(e.code); if (mode === 'walk' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (mode === 'walk' && /Key[WASD]|Arrow/.test(e.code)) $('hint').classList.add('gone');
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
function pick(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0]; if (!hit || hit.distance > 40) return null;
  const c = hit.object.userData.cars[hit.instanceId]; return c && matches(c) ? c : (c || null);
}
let drag = null; let hoverReq = null, hoverNext = 0;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0, id: e.pointerId }; if (mode === 'walk') { canvas.setPointerCapture(e.pointerId); canvas.classList.add('grabbing'); } });
canvas.addEventListener('pointermove', e => {
  if (drag && drag.id === e.pointerId) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
    if (mode === 'walk') { const k = e.pointerType === 'touch' ? .0055 : .0034; walk.yaw -= dx * k; walk.pitch = Math.max(-1.1, Math.min(.9, walk.pitch - dy * k)); }
  } else if (e.pointerType === 'mouse' && mode !== 'interior') {
    hoverReq = { x: e.clientX, y: e.clientY };
  }
});
canvas.addEventListener('pointerup', e => {
  canvas.classList.remove('grabbing');
  if (drag && drag.moved < 8 && mode !== 'interior' && mode !== 'tween') { const c = pick(e.clientX, e.clientY); if (c && c !== sel) selectCar(c); }
  drag = null;
});
canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('grabbing'); });

// joystick táctil
const joy = $('joy'), knob = joy.querySelector('i'); const stick = { x: 0, y: 0, id: null };
joy.addEventListener('pointerdown', e => { stick.id = e.pointerId; joy.setPointerCapture(e.pointerId); moveStick(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === stick.id) moveStick(e); });
const endStick = () => { stick.id = null; stick.x = stick.y = 0; knob.style.transform = ''; };
joy.addEventListener('pointerup', endStick); joy.addEventListener('pointercancel', endStick);
function moveStick(e) { const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const m = Math.hypot(dx, dy), max = r.width / 2 - 14; if (m > max) { dx *= max / m; dy *= max / m; } stick.x = dx / max; stick.y = dy / max; knob.style.transform = `translate(${dx}px,${dy}px)`; }

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ---------------- bucle ---------------- */
const clock = new THREE.Clock(); const mv = new THREE.Vector3();
camera.position.copy(walk.pos); camera.rotation.set(walk.pitch, walk.yaw, 0);
function frame() {
  const rawDt = clock.getDelta(); const dt = Math.min(rawDt, .05); const tt = clock.elapsedTime;
  if (tween) {
    tween.t += Math.min(rawDt, .25) / tween.dur; const k = ease(Math.min(1, tween.t));
    camera.position.lerpVectors(tween.fp, tween.tp, k); camera.quaternion.slerpQuaternions(tween.fq, tween.tq, k);
    if (tween.t >= 1) { const d = tween.done; tween = null; camera.rotation.setFromQuaternion(camera.quaternion, 'YXZ'); d && d(); }
  } else if (mode === 'walk') {
    let fx = 0, fz = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) fz += 1; if (keys.has('KeyS') || keys.has('ArrowDown')) fz -= 1;
    if (keys.has('KeyD')) fx += 1; if (keys.has('KeyA')) fx -= 1;
    if (keys.has('ArrowLeft')) walk.yaw += dt * 1.8; if (keys.has('ArrowRight')) walk.yaw -= dt * 1.8;
    fz -= stick.y; fx += stick.x;
    const run = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 2.1 : 1; const speed = 5.2 * run;
    const sy = Math.sin(walk.yaw), cy = Math.cos(walk.yaw);
    mv.set((-sy * fz + cy * fx), 0, (-cy * fz - sy * fx)); if (mv.lengthSq() > 1) mv.normalize();
    walk.vel.lerp(mv.multiplyScalar(speed), 1 - Math.exp(-dt * 10));
    walk.pos.addScaledVector(walk.vel, dt); collide(walk.pos);
    const bob = REDUCE ? 0 : Math.sin(tt * 9) * .025 * Math.min(1, walk.vel.length() / 4);
    camera.position.set(walk.pos.x, 1.65 + bob, walk.pos.z); camera.rotation.set(walk.pitch, walk.yaw, 0);
  } else if (controls.enabled) controls.update();

  if (hoverReq && tt > hoverNext && !tween) { hover = pick(hoverReq.x, hoverReq.y); canvas.classList.toggle('pointing', !!hover); hoverReq = null; hoverNext = tt + .08; }
  // aro y foco
  const target = sel || (mode === 'walk' ? hover : null);
  if (target) { ring.position.x = ringIn.position.x = target.x; ring.position.z = ringIn.position.z = target.z; const s = Math.max(target.L, target.W) * .62; ring.scale.setScalar(s); ringIn.scale.setScalar(s); ringMat.opacity += ((sel ? .9 : .55) - ringMat.opacity) * .15; ringIn.material.opacity += ((sel ? .1 : .05) - ringIn.material.opacity) * .15; }
  else { ringMat.opacity *= .85; ringIn.material.opacity *= .85; }
  spot.intensity += ((sel && mode !== 'interior' ? 22 : 0) - spot.intensity) * .08;

  renderer.render(scene, camera);
  updateTags();
  requestAnimationFrame(frame);
}
bar(1);
document.fonts && document.fonts.ready.then(() => {});
requestAnimationFrame(() => { frame(); setTimeout(() => $('loader').classList.add('done'), 250); });
// abrir directo un auto con #slug
const hash = decodeURIComponent(location.hash.slice(1)); if (hash) { const c = cars.find(x => x.slug === hash); if (c) setTimeout(() => selectCar(c), 600); }
window.__tutu = { cars, selectCar, enterInterior, backToWalk, walk, camera };
</script>
